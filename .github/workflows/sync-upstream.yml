name: sync upstream

# Brings each of PaperMC's release lines into this fork.
#
# Lines are discovered rather than listed, so dev/5.0.0 gets picked up the day it
# appears. Nothing is published here: changes arrive as PRs that already built,
# and failures open an issue.
#
# One long-lived branch and one open PR per line, updated in place rather than a
# new PR per upstream commit. Upstream sits on the same version for months, so a
# PR per commit would be ~50 PRs and ~50 releases a year all called
# 4.1.0-SNAPSHOT. The PR accumulates instead, says whether the version has moved,
# and you merge when it is worth a release.

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/PaperMC/Velocity.git
  PATCH: phantom/handshake-hostname.patch

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.find.outputs.lines }}
    steps:
      # Lines are discovered so a future one is picked up on its own, but
      # dev/N.0.0 on its own is not enough: upstream still carries dev/2.0.0 from
      # 2021 and an abandoned dev/5.0.0 from 2023. A line counts if it has moved
      # recently, or if we already ship it.
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '180 days ago' +%Y-%m-%dT%H:%M:%SZ)
          ours=$(gh api "repos/${{ github.repository }}/branches" --paginate --jq '.[].name')
          live=""
          for line in $(gh api repos/PaperMC/Velocity/branches --paginate --jq '.[].name' \
                        | { grep -E '^dev/[0-9]+\.0\.0$' || true; }); do
            if echo "$ours" | grep -qxF "$line"; then
              live="$live $line"
              continue
            fi
            last=$(gh api "repos/PaperMC/Velocity/branches/$line" --jq '.commit.commit.author.date')
            if [[ "$last" > "$cutoff" ]]; then
              live="$live $line"
            else
              echo "skipping $line, last touched $last"
            fi
          done
          # printf with nothing still prints a newline, which would make [""]
          if [ -z "$live" ]; then
            lines='[]'
          else
            lines=$(printf '%s\n' $live | jq -R . | jq -sc .)
          fi
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "tracking: $lines"

  sync:
    needs: discover
    if: needs.discover.outputs.lines != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.discover.outputs.lines) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM" || true
          git fetch -q upstream "${{ matrix.line }}"
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Decide what to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line="${{ matrix.line }}"
          branch="sync/${line//\//-}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          if ! git rev-parse --verify -q "origin/$line" >/dev/null; then
            echo "do=adopt" >> "$GITHUB_OUTPUT"
            echo "$line is new to this fork"
            exit 0
          fi
          # Against the open sync branch when there is one: it is what already
          # carries upstream while the PR waits to be merged, and comparing
          # against the line instead would rebuild every night for nothing.
          head="origin/$line"
          if git rev-parse --verify -q "origin/$branch" >/dev/null; then
            head="origin/$branch"
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" "$head"; then
            echo "do=merge" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Upstream is in, but the PR carrying it may not be. A run that pushed
          # the branch and then died before opening the PR would be "already has
          # it" every night after, and the merge would sit on the branch with
          # nothing pointing at it, under a green tick.
          if [ "$head" != "origin/$line" ] \
             && ! git merge-base --is-ancestor "origin/$branch" "origin/$line" \
             && [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = "0" ]; then
            echo "do=pr" >> "$GITHUB_OUTPUT"
            echo "$branch carries $UPSTREAM_SHORT but has no open PR"
          else
            echo "do=nothing" >> "$GITHUB_OUTPUT"
            echo "$head already has $UPSTREAM_SHORT"
          fi

      - name: Identify
        if: steps.plan.outputs.do != 'nothing'
        run: |
          git config user.name "PhantomMarket"
          git config user.email "dev@phantom-node.com"

      # Merge, not rebase-onto-upstream: the branch keeps descending from ours, so
      # the PR is an ordinary merge and our own files come along by themselves.
      - name: Merge upstream into the line
        if: steps.plan.outputs.do == 'merge'
        run: |
          branch="${{ steps.plan.outputs.branch }}"
          # Continue the open branch when there is one, so the PR keeps its
          # history and its comments instead of being replaced every night.
          if git rev-parse --verify -q "origin/$branch" >/dev/null; then
            git checkout -q -B "$branch" "origin/$branch"
            git merge --no-edit "origin/${{ matrix.line }}"
          else
            git checkout -q -B "$branch" "origin/${{ matrix.line }}"
          fi
          git merge --no-edit "$UPSTREAM_SHA"

      # A new line has no base to open a PR against, so upstream is pushed as-is
      # first and the patch arrives the normal way. .github is left out on
      # purpose: GITHUB_TOKEN can't push workflow files, so a new major line
      # needs them copied once by hand (or a PAT with the workflow scope).
      - name: Adopt a new line
        if: steps.plan.outputs.do == 'adopt'
        run: |
          git push origin "$UPSTREAM_SHA:refs/heads/${{ matrix.line }}"
          git checkout -q -B "${{ steps.plan.outputs.branch }}" "$UPSTREAM_SHA"
          default="${{ github.event.repository.default_branch }}"
          git checkout "origin/$default" -- "$PATCH" README.md
          git apply -3 "$PATCH"
          git add -A
          git commit -qm "phantom: send the backend's own address in the handshake"

      # Nothing to merge, so the tree only has to come down to be rebuilt and
      # have its PR opened.
      - name: Pick up the unopened sync branch
        if: steps.plan.outputs.do == 'pr'
        run: |
          branch="${{ steps.plan.outputs.branch }}"
          git checkout -q -B "$branch" "origin/$branch"

      - uses: actions/setup-java@v4
        if: steps.plan.outputs.do != 'nothing'
        with:
          distribution: temurin
          # 17 on 3.x, 25 on 4.x; install all so the toolchain finds its own
          java-version: |
            17
            21
            25

      - name: Build and check
        if: steps.plan.outputs.do != 'nothing'
        run: ./gradlew :velocity-proxy:checkstyleMain :velocity-proxy:shadowJar --no-daemon

      # Boots the jar and logs into it. The diff compiling says nothing about
      # whether the running proxy still rewrites the hostname.
      - name: Check the handshake end to end
        if: steps.plan.outputs.do != 'nothing'
        run: python3 phantom/e2e-handshake.py proxy/build/libs/velocity-proxy-*-all.jar

      # The token is the other half and lives in different classes; the login and
      # the ping build their handshake separately, so both are checked.
      - name: Check the token end to end
        if: steps.plan.outputs.do != 'nothing'
        run: python3 phantom/e2e-token.py proxy/build/libs/velocity-proxy-*-all.jar

      - name: Compare versions
        id: version
        if: steps.plan.outputs.do != 'nothing'
        run: |
          now=$(sed -n 's/^version=//p' gradle.properties)
          was=$(git show "origin/${{ matrix.line }}:gradle.properties" 2>/dev/null | sed -n 's/^version=//p')
          echo "now=$now" >> "$GITHUB_OUTPUT"
          if [ -n "$was" ] && [ "$was" != "$now" ]; then
            echo "note=Version moved from \`$was\` to \`$now\` — worth releasing." >> "$GITHUB_OUTPUT"
          else
            echo "note=Still \`$now\`. Upstream fixes only; merge when one of them matters." >> "$GITHUB_OUTPUT"
          fi

      # Through env, not ${{ }}: the note is markdown and contains backticks, and
      # pasted into the script those are command substitution, not text.
      - name: Open or update the pull request
        if: steps.plan.outputs.do != 'nothing'
        env:
          GH_TOKEN: ${{ github.token }}
          LINE: ${{ matrix.line }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          VERSION: ${{ steps.version.outputs.now }}
          NOTE: ${{ steps.version.outputs.note }}
        run: |
          git push -q origin "$BRANCH"
          body="Upstream \`$LINE\` is at \`$UPSTREAM_SHA\`. Builds and passes checkstyle with our patch applied. $NOTE Merging publishes one release and refreshes the version index the panel reads."
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base "$LINE" --head "$BRANCH" \
              --title "Sync $LINE ($VERSION)" --body "$body" | cat
          else
            gh pr edit "$BRANCH" --title "Sync $LINE ($VERSION)" --body "$body" | cat
          fi

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="sync ${{ matrix.line }} failed"
          # one open issue per line, or the nightly run files it every morning.
          # counting beats reading .[0].number, which comes back as "null".
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body \
              "Merging upstream \`${{ matrix.line }}\` conflicted, or the result did not build. [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Usually means upstream rewrote the handshake code and the patch needs redoing by hand."
          fi
